#######################################################################################
# Book settings
# Full reference: https://jupyterbook.org/en/stable/customize/config.html

title: CME 302 Numerical Linear Algebra
author: Eric Darve
copyright: "2026"

# Files and folders that are kept in the repo but are not part of the book.
exclude_patterns:
  - README.md
  - .venv/**        # Local Python build environment, not book content
  - manimations/*      # Manim sources for the animations; rendered separately
  - addl_material/*    # Notes not listed in _toc.yml

#######################################################################################
# Repository link
# Adds a GitHub button to the header of every page.

repository:
  url: https://github.com/EricDarve/NLA
  branch: main

html:
  use_repository_button: true

#######################################################################################
# Notebook execution settings

execute:
  execute_notebooks: auto   # One of "auto", "force", "cache", "off"
  timeout: 600              # Max seconds allowed per cell
  allow_errors: false       # Stop the build if a cell raises
  stderr_output: show

#######################################################################################
# Sphinx settings

sphinx:
  extra_extensions:
    - sphinx_proof         # Provides the {prf:theorem}, {prf:definition}, ... directives
