name = "nlaLU"
version = "0.1.0"
defaultTargets = ["LU"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.24.0"

[[lean_lib]]
name = "LU"
# The root module `LU` imports every module; the modules live in `src/`.
globs = ["LU", "src.+"]
